# Render blueprint for the backend API. The frontend is a static build on Vercel
# (see frontend/vercel.json); it reaches this service through VITE_API_BASE_URL,
# and this service must list that origin in CORS_ORIGINS.
#
# APP_ENV is "development" here on purpose. The demo's GLM gateway is reachable
# only over plain HTTP, and production startup validation rejects a non-HTTPS
# model endpoint (app/core/config.py). Rather than weaken that check, the hosted
# demo runs as development with the production-shaped settings set explicitly
# below. See docs/DEPLOYMENT.md, "Hosted demo".
services:
  - type: web
    name: simplotel-agent-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-graceful-shutdown 25
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: APP_ENV
        value: development
      - key: AI_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        value: glm
      - key: LLM_MODEL
        value: glm-5.2
      # Production-shaped settings, set explicitly because APP_ENV=development
      # does not enforce them.
      - key: LOG_FORMAT
        value: json
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: AUTH_MODE
        value: disabled
      # Kept on so a reviewer can open /docs against the live API.
      - key: EXPOSE_API_DOCS
        value: "true"
      # /metrics must not be public (docs/SYSTEM_DESIGN.md, docs/DEPLOYMENT.md).
      # The demo API has no internal network, so the endpoint is switched off.
      - key: METRICS_ENABLED
        value: "false"
      # Set in the Render dashboard, never committed:
      #   LLM_API_KEY   the GLM gateway key
      #   LLM_BASE_URL  the GLM gateway base URL
      #   CORS_ORIGINS  the deployed Vercel origin, e.g. https://simplotel-agent.vercel.app
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
