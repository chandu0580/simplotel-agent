# Included in every location: nginx drops inherited add_header directives in any block that sets its own.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
# The assistant needs no device APIs; deny them so injected content can't request them either.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# 'unsafe-inline' for style-src only: hotel brand colours are applied as an inline CSS variable.
# To embed the assistant as a widget on hotel sites, replace frame-ancestors/X-Frame-Options with the hotel origins.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Strict-Transport-Security is NOT sent here: this server speaks plain HTTP inside the stack. It is added where TLS
# terminates (see security-headers-tls.conf, included by the TLS edge). Sending HSTS over HTTP has no effect.
