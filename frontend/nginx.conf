# Serves the built SPA and proxies /api to the backend (same origin, so no CORS in this topology).
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location /api/ {
    proxy_pass http://backend:8000;
    # Overwrite (not append) so a client can't spoof the IP used for rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
    client_max_body_size 64k;
    # The backend sets these too; hide its copies so responses don't carry duplicates.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
