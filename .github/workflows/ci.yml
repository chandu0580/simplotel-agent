name: CI

# Never needs an LLM credential or Docker: every job runs offline, against mocks, or with AI disabled.
# The optional Redis/PostgreSQL adapter tests (tests/integration) skip here; run them locally when those services are available.
# Live model evaluation is a separate, manual workflow (live-ai-eval.yml).

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests evals scripts perf
      - name: Unit, contract, security and API tests
        run: python -m pytest
      - name: Offline AI evaluation (regression gate against the committed baseline)
        run: python -m evals.run_evals --mode offline --label ci-offline --baseline evals/results/offline.json
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Secret scan of every tracked file
        run: python backend/scripts/scan_secrets.py --git
      - name: No environment files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then echo "environment file committed"; exit 1; fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx oxlint src e2e
      - name: Type check and build
        run: npm run build
      - name: Component tests
        run: npm test
      - name: No credentials in the production bundle
        run: python3 ../backend/scripts/scan_secrets.py dist
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: End-to-end (AI disabled, deterministic)
        run: npm run test:e2e
        working-directory: frontend
